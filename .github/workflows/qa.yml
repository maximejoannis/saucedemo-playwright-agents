name: QA Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Validate and assemble QA portal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java
        run: java -version

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Quality Gate
        run: npm run quality:report

      - name: Run Playwright tests
        run: npm test

      - name: Generate QA coverage report
        run: npm run coverage:report

      - name: Validate Allure results
        run: test -d allure-results && test -n "$(find allure-results -type f -print -quit)"

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Validate Allure report
        run: test -f allure-report/index.html

      - name: Assemble QA portal
        run: |
          mkdir -p site/playwright site/allure site/coverage site/quality
          cp -R reporting/qa-portal/. site/
          cp -R playwright-report/. site/playwright/
          cp -R allure-report/. site/allure/
          cp -R coverage-report/. site/coverage/
          cp -R quality-report/. site/quality/
          touch site/.nojekyll

      - name: Generate CI data for QA portal
        run: npm run portal:data

      - name: Validate assembled QA portal
        run: |
          test -f site/index.html
          test -f site/playwright/index.html
          test -f site/allure/index.html
          test -f site/coverage/index.html
          test -f site/quality/index.html
          test -f site/portal-data.js

      - name: Upload QA diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            allure-results/
            allure-report/
            coverage-report/
            quality-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Configure GitHub Pages
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy QA portal to GitHub Pages
    needs: qa
    if: ${{ needs.qa.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
